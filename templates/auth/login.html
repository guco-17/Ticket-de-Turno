{% extends "base.html" %}

{% block title %}Acceso de administradores | Ticket de Turno{% endblock %}

{% block content %}
<section class="mx-auto auth-card">
    <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Acceso de administradores</h1>
            <p class="text-body-secondary mb-4">Ingresa tus credenciales y resuelve el CAPTCHA.</p>

            <form action="{{ url_for('auth.login_submit') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input
                        class="form-control"
                        type="text"
                        id="usuario"
                        name="usuario"
                        autocomplete="username"
                        maxlength="50"
                        required
                        autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input
                        class="form-control"
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        maxlength="256"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block" for="captcha">Código de verificación</label>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <img
                            class="captcha-image border rounded"
                            id="captcha-image"
                            src="{{ url_for('auth.captcha_image') }}"
                            alt="Código CAPTCHA de seis caracteres">
                        <button
                            class="btn btn-outline-secondary"
                            id="refresh-captcha"
                            type="button"
                            aria-label="Generar otro CAPTCHA">
                            Actualizar
                        </button>
                    </div>
                    <input
                        class="form-control"
                        type="text"
                        id="captcha"
                        name="captcha"
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        maxlength="6"
                        pattern="[A-Za-z0-9]{6}"
                        aria-describedby="captcha-help"
                        required>
                    <div class="form-text" id="captcha-help">Escribe los seis caracteres de la imagen.</div>
                </div>
                <button class="btn btn-primary w-100 mt-2" type="submit">Iniciar sesión</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/captcha.js') }}" defer></script>
{% endblock %}
